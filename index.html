<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Ping coming soon page</title>
</head>
<body>
  <header>
    <img src="./images/logo.svg" alt="logo" width="86" height="26">
  </header>

  <main>
    <h1>
      <span>We are launching</span> soon!
    </h1>

    <h2>Subscribe and get notified</h2>

    <form autocomplete="off">
      <input type="email" placeholder="Your email address...">
      <p class="mobile-error-state">Please provide a valid email address</p>
      <input type="submit" value="Notify Me">
    </form>

    <p class="desktop-error-state">Please provide a valid email address</p>

    <img src="./images/illustration-dashboard.png" alt="dashboard-illustration">
  </main>

    <footer>
      <p>&copy; Copyright Ping. All rights reserved.</p>

      <section class="attribution">
        <p>
          Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. | Coded by <a href="https://github.com/grace-sampao" target="_blank">Grace Sampao</a>.
        </p>
      </section>
    </footer>
</body>
</html>
